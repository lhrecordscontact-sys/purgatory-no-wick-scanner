services:
  - type: web
    name: purgatory-no-wick-web
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: starter
  - type: worker
    name: purgatory-no-wick-paper
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    plan: starter
    disk:
      name: paper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PAPER_DB
        value: /var/data/paper.db
